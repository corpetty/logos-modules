name: Release muster-ui

# Manually-triggered release for the muster_ui QML module, which lives
# in the muster monorepo submodule at submodules/muster/ui. Delegates to
# the shared _release-module.yml (signing config lives there). The release
# action resolves the containing submodule from this subdir path.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/muster/ui
      force_build: ${{ inputs.force_build }}
    secrets: inherit
