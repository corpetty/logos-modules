name: Release logos-wallet (core)

# Manually-triggered release for the logos_wallet core module. Unlike the
# add-module.sh-generated workflows, the module lives in a SUBDIRECTORY of
# the logos-workshop submodule, so this file is hand-authored and passes
# the full path. Pipeline changes belong in _release-module.yml (shared).
#
# Source of truth for module name + version is
# submodules/logos-workshop/logos-wallet/logos-wallet-core/metadata.json.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-workshop/logos-wallet/logos-wallet-core
      force_build: ${{ inputs.force_build }}
    secrets: inherit
